<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>רישום מדריכות למשחקייה</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <div class="wrap narrow">
    <div class="top-header">
      <div class="brand">
        <img src="assets/logo.png" alt="לוגו שפרה ופועה" />
        <h1>רישום מדריכות למשחקייה</h1>
      </div>
    </div>

    <div class="card" id="formCard">
      <p class="muted">מלאי את הפרטים הבאים כדי להצטרף לרשימת המדריכות המתנדבות.</p>
      <form id="signupForm">
        <div class="field">
          <label for="firstName">שם פרטי</label>
          <input type="text" id="firstName" required />
        </div>
        <div class="field">
          <label for="lastName">שם משפחה</label>
          <input type="text" id="lastName" required />
        </div>
        <div class="field">
          <label for="phone">טלפון</label>
          <input type="tel" id="phone" required />
        </div>
        <div class="field">
          <label for="age">גיל</label>
          <input type="number" id="age" min="0" max="120" />
        </div>
        <div class="field">
          <label for="hebrewBirthDate">תאריך לידה עברי</label>
          <input type="text" id="hebrewBirthDate" placeholder='לדוגמה: י"ד בניסן תשפ"ו' />
        </div>
        <button type="submit" class="btn">הרשמה</button>
        <div class="status-msg" id="signupStatus"></div>
      </form>
    </div>

    <div class="card hidden" id="successCard">
      <h2>נרשמת בהצלחה! 🎉</h2>
      <p class="muted">תודה שהצטרפת לצוות המדריכות של משחקיית שפרה ופועה.</p>
    </div>

    <footer class="foot">ארגון שפרה ופועה — משחקייה</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/madricha-signup.js"></script>
</body>
</html>
